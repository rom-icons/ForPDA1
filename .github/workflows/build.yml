name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Pods (if needed)
        run: |
          if [ -f Podfile ]; then
            pod install
          fi

      - name: Build Archive
        run: |
          # Определение воркспейса или проекта
          if [ -d "ForPDA.xcworkspace" ]; then
            TARGET="-workspace ForPDA.xcworkspace"
          else
            TARGET="-project ForPDA.xcodeproj"
          fi

          xcodebuild clean archive \
            $TARGET \
            -scheme ForPDA \
            -configuration Release \
            -archivePath build/ForPDA.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package to IPA
        run: |
          mkdir -p Payload
          # Копируем .app из архива
          cp -r build/ForPDA.xcarchive/Products/Applications/*.app Payload/
          zip -r ForPDA.ipa Payload/
          ls -la ForPDA.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForPDA-unsigned-ipa
          path: ForPDA.ipa

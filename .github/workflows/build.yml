name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 15 # Защита: сборка завершится принудительно через 15 минут, если зависнет
    env:
      CI: true
      FASTLANE_SKIP_UPDATE_CHECK: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CocoaPods
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update --clean-install
          fi

      - name: Build Archive
        run: |
          # Поиск схемы
          SCHEME=$(xcodebuild -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); schemes=data.get('project', {}).get('schemes', []) or data.get('workspace', {}).get('schemes', []); print(schemes[0])")
          echo "Scheme: $SCHEME"

          if [ -d "ForPDA.xcworkspace" ]; then
            TARGET="-workspace ForPDA.xcworkspace"
          else
            TARGET="-project ForPDA.xcodeproj"
          fi

          # Сборка строго без интерактивных запросов связки ключей
          xcodebuild clean archive \
            $TARGET \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/ForPDA.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package to IPA
        run: |
          mkdir -p Payload
          find build/ForPDA.xcarchive/Products/Applications -name "*.app" -maxdepth 1 -exec cp -r {} Payload/ \;
          zip -r ForPDA.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForPDA-unsigned-ipa
          path: ForPDA.ipa
